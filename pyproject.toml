[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

# 小满后端打包说明（M1.1）
#
# 分层目标（渐进式，物理目录暂不搬动）：
#   xiaoman.core    —— 确定性内核：账本/分析/行情/解析/加密/导入
#   xiaoman.server  —— HTTP 壳：FastAPI 应用、路由、中间件
#   xiaoman.cli     —— 命令行入口
#   xiaoman.mcp     —— MCP Server（模块名避开顶层 "mcp"，那是官方 SDK）
#
# 为什么不在这一步就把 backend/app/ 物理拆成四个目录：
# 60+ 个模块之间是双向引用，一次性搬动会产生上千行 import 改动，且无法在
# 单次提交里审阅。本包先用 re-export 建立可用的分层门面，让新代码只依赖
# xiaoman.core / xiaoman.server 的稳定接口；旧路径 backend.app.* 保持可用，
# 后续按域逐步迁移（计划中约定的 3 个月兼容期）。

[project]
name = "xiaoman"
version = "3.0.0"
description = "小满 —— 能自主干活的 AI 财务部门（本地优先、数字可复核、全 MCP 开放）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "badhope" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "aiosqlite>=0.22,<0.23",
  "httpx>=0.28,<0.29",
  "litellm>=1.77,<2",
  "openai>=2.20,<3",
  "tiktoken>=0.8,<1",
  "cn2an>=0.5.24,<0.6",
  "python-dotenv>=1.0,<2",
  "apscheduler>=3.10,<4",
  "cryptography>=44,<45",
  "pydantic>=2.14,<2.15",
  "pyjwt>=2.9,<3",
  "passlib[bcrypt]>=1.7,<2",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
# —— 通用层：直接接业界成熟开源，不重复造轮子 ——
full = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=1.30,<2",
  "fastmcp>=2.0,<3",
  "rank-bm25>=0.2,<1",
  "cachetools>=5.0,<6",
  "duckduckgo_search>=6.0,<7",
  "sse-starlette>=1.6,<2",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-timeout>=2,<3",
  "pytest-cov>=5,<7",
  "pytest-asyncio>=0.24,<1",
  "pytest-xdist>=3.5,<4",
  "ruff>=0.8,<1",
]

[project.scripts]
# 命令行入口（M4.1 的最小可用形态：记账/查询/提问/起服务）
xiaoman = "xiaoman.cli:main"

[project.urls]
Homepage = "https://github.com/badhope/xiaoman"
Documentation = "https://github.com/badhope/xiaoman/tree/main/docs"

[tool.setuptools]
# 两套包目录：实现包 app.* 在 backend/ 下，门面包 xiaoman.* 在仓库根。
# 门面只是 re-export，缺了 app 装完就跑不起来（实测 ModuleNotFoundError: app）。
package-dir = { "" = "backend", "xiaoman" = "xiaoman" }
packages = [
  "app",
  "app.agents",
  "app.agents.bookkeeping",
  "app.agents.portfolio",
  "app.agents.supervisor",
  "app.calculations",
  "app.db",
  "app.import_parsers",
  "app.routes",
  "xiaoman",
  "xiaoman.core",
  "xiaoman.server",
  "xiaoman.cli",
  "xiaoman.mcp",
]

[tool.setuptools.package-data]
app = ["agents/**/*.md", "agents/**/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
