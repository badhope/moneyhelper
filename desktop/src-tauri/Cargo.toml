[package]
name = "moneyhelper-desktop"
version = "4.8.0"
edition = "2021"
description = "Moneyhelper desktop shell"
authors = ["badhope"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
