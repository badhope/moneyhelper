# Moneyhelper 文档站（mkdocs-material）
#
# 本地预览：
#   pip install -r docs/requirements.txt
#   mkdocs serve            # http://127.0.0.1:8000
# 构建静态站：
#   mkdocs build --strict   # 严格模式：任何坏链/缺文件即失败

site_name: Moneyhelper
site_description: 能自主干活的 AI 财务部门 — 本地优先、数字可复核、全 MCP 开放
site_url: https://badhope.github.io/moneyhelper/
repo_url: https://github.com/badhope/moneyhelper
repo_name: badhope/moneyhelper

theme:
  name: material
  language: zh
  features:
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # 跟随系统深浅色：文档站不该强迫读者在两个主题里做选择
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换浅色

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页: index.md
  - 文档地图: doc-map.md
  - 快速开始: quickstart.md
  - 使用:
      - 对话工作流: WORKFLOW.md
      - Workflow (EN): WORKFLOW.en.md
      - 命令行: cli.md
      - Agent Studio: studio.md
      - MCP 接入: mcp-guide.md
  - 部署与配置:
      - 自托管部署: self-host.md
      - 部署指南: DEPLOY.md
      - Deploy (EN): DEPLOY.en.md
      - 配置参考: CONFIG.md
      - Config (EN): CONFIG.en.md
  - 架构:
      - 架构总览: architecture.md
      - 架构说明（详版）: ARCHITECTURE-detail.md
      - 技术栈盘点: ARCHITECTURE-v2.md
      - 架构决策记录: adr/index.md
      - 模块清单: module-map.md
  - 开发:
      - 开发指南: DEVELOPMENT.md
      - Development (EN): DEVELOPMENT.en.md
      - 代码规范: CODE_STYLE.md
      - 发版流程: RELEASE.md
  - 路线图:
      - 实施进度: PROGRESS.md
      - 路线图: ROADMAP-v3.md
      - 详细计划: PLAN-DETAILED.md
      - 差异化: DIFFERENTIATION.md
      - Agent Harness 调研: planning/11-agent-harness-专项调研.md
  - 规划归档:
      - 发现记录: planning/02-发现记录.md
      - 审查报告（完整版）: planning/03-审查报告完整版.md
      - 协议生态探讨: planning/04-方向探讨-协议生态与差异化.md
      - 协议生态时间线: planning/05-协议生态全景时间线.md
      - 能力扩展战略: planning/06-能力扩展与工程化战略.md
      - 对标项目研究: planning/07-对标项目深度学习报告.md
      - 总体规划: planning/08-总体规划-完整版.md
      - 差异化头脑风暴: planning/09-差异化头脑风暴.md
      - 同类项目研究: research/peer-projects.md
  - 质量与审计（历史）:
      - 代码审查发现: REVIEW-FINDINGS.md
      - 内部严格评审（历史快照）: REVIEW-内部严格评审.md
      - 前端审计（历史快照）: AUDIT-frontend.md
      - 企业级深度审计（历史快照）: AUDIT-enterprise-deep-20261007.md

# 严格构建：nav 里写错文件名会直接失败，避免文档站悄悄缺页。
# 注意：strict 模式下**未列入 nav 的页面会告警并失败**，所以 docs/ 下每个
# 需要发布的 .md 都必须出现在上面。
strict: true
