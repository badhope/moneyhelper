line-length = 88
target-version = "py312"
extend-exclude = [".venv", "backend/.venv", "node_modules", "dist", ".aqg"]

[lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
]
ignore = [
  # 中文 docstring/日志串天然易超 88
  "E501",
  # 代码按审计习惯保留 `# noqa: BLE001`；BLE 未进 select，避免 RUF100 误杀
  "RUF100",
  "RUF001",
  "RUF002",
  "RUF003",
  "SIM105",
  "UP017",
  "UP041",
  # FastAPI 依赖注入惯用法：Depends(...) 写在参数默认值（框架要求的写法）
  "B008",
  # 刻意不合并 if 分支：strategy.compute_fire 里 target<=0 与净值为负是两种不同语义
  # （前者"没有目标"、后者"已达成"），合并成一个条件会丢掉区分意图的注释
  "SIM114",
]
