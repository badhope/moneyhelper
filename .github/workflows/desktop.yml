name: Desktop Build

# 多平台桌面产物构建。
#
# 为什么单独一个工作流：桌面包必须在各自的操作系统上打（PyInstaller 不能交叉编译），
# 且构建耗时较长（每个平台 5–10 分钟），不适合塞进每次 push 的 CI。
#
# 触发：
#   - 推送 v* tag 时自动构建并上传到 Release
#   - 也可手动触发，只产出 artifact 供下载
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            artifact: moneyhelper-windows-x64
            binary: moneyhelper.exe
            # Release 上的文件名：三平台必须不同，否则 Linux/macOS 都叫 moneyhelper 会互相覆盖
            asset: moneyhelper-windows-x64.exe
          - os: macos-latest
            name: macOS arm64
            artifact: moneyhelper-macos-arm64
            binary: moneyhelper
            asset: moneyhelper-macos-arm64
          - os: ubuntu-latest
            name: Linux x64
            artifact: moneyhelper-linux-x64
            binary: moneyhelper
            asset: moneyhelper-linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 安装后端依赖（含 PyInstaller）
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # 只装运行时依赖 + PyInstaller。测试依赖（opencv 111MB / reportlab /
          # qrcode）在 requirements-dev.txt，不进发行产物。
          python -m pip install -r requirements.txt pyinstaller

      - name: 打包单文件
        working-directory: backend
        run: pyinstaller moneyhelper.spec --noconfirm --distpath dist --workpath build

      - name: 冒烟测试（产物能启动并响应健康检查）
        shell: bash
        run: |
          set -euo pipefail
          cd backend/dist
          ./${{ matrix.binary }} > run.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:8788/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          # Windows 上 $PID 是 bash 包装进程，PyInstaller 单文件启动的真实进程是子进程，
          # 只 kill $PID 会让 moneyhelper.exe 继续占用文件，后续重命名/上传必然失败。
          kill $PID 2>/dev/null || true
          if command -v taskkill >/dev/null 2>&1; then
            taskkill //F //IM "${{ matrix.binary }}" >/dev/null 2>&1 || true
          else
            pkill -f "${{ matrix.binary }}" 2>/dev/null || true
          fi
          sleep 3
          if [ "$ok" != "1" ]; then
            echo "::error::打包产物未能启动"
            tail -40 run.log
            exit 1
          fi
          echo "产物启动正常"

      - name: 安装 NSIS（仅 Windows，用于打安装包）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NSIS 在 Windows runner 上通常预装；缺失时用 choco 补，避免静默跳过安装包。
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $makensis)) { throw "NSIS 安装失败" }

      - name: 构建 Windows 安装包
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^__version__' backend/app/version.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION"
          "/c/Program Files (x86)/NSIS/makensis.exe" \
            -DVERSION="$VERSION" \
            -DSRCEXE='..\backend\dist\moneyhelper.exe' \
            installer/moneyhelper.nsi
          ls -lh backend/dist/Moneyhelper-Setup-*.exe

      - name: 安装包冒烟（静默装 → 健康检查 → 静默卸）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SETUP=$(ls backend/dist/Moneyhelper-Setup-*.exe | head -1)
          "$SETUP" //S
          INSTALLED="$LOCALAPPDATA/Programs/Moneyhelper/moneyhelper.exe"
          for i in $(seq 1 30); do [ -f "$INSTALLED" ] && break; sleep 2; done
          if [ ! -f "$INSTALLED" ]; then echo "::error::安装后找不到程序"; exit 1; fi
          echo "安装成功：$INSTALLED"

          MONEYHELPER_DATA_DIR="$RUNNER_TEMP/mh-data" PORT=8791 MONEYHELPER_NO_BROWSER=1 \
            "$INSTALLED" > "$RUNNER_TEMP/app.log" 2>&1 &
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:8791/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          taskkill //F //IM moneyhelper.exe >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then echo "::error::安装版未能启动"; tail -40 "$RUNNER_TEMP/app.log"; exit 1; fi
          echo "安装版启动正常"

          "$LOCALAPPDATA/Programs/Moneyhelper/uninstall.exe" //S
          sleep 20
          if [ -f "$INSTALLED" ]; then echo "::error::卸载后程序仍存在"; exit 1; fi
          echo "卸载清理正常"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            backend/dist/${{ matrix.binary }}
            backend/dist/Moneyhelper-Setup-*.exe
          if-no-files-found: error

      - name: 重命名为平台专属文件名
        shell: bash
        run: cp "backend/dist/${{ matrix.binary }}" "backend/dist/${{ matrix.asset }}"

      - name: 附加到 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Windows 同时上传「免安装单文件」和「安装包」，用户按需选择。
          files: |
            backend/dist/${{ matrix.asset }}
            backend/dist/Moneyhelper-Setup-*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
