# 镜像同步：主仓(GitHub badhope) → GitCode badhope + Gitee badhope + GitHub 两个镜像仓
# 注意：GitHub Actions 不支持 secrets 动态索引，故用显式 job 写死 secret 名。
# 用户名必须是 oauth2（GitCode/Gitee 均不接受平台用户名 + token 的 Basic 认证）。
name: mirror-sync
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gitcode:
    # 只在主仓执行：镜像目标固定为 gitcode/gitee 的 badhope 仓库，
    # 其余镜像/派生仓库没有对应 Secrets，跑起来只会红。
    if: github.repository == 'badhope/moneyhelper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: push to gitcode (with retry)
        run: |
          git remote add mirror "https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/badhope/moneyhelper.git"
          for i in 1 2 3; do
            git push mirror main --force && git push mirror --tags --force && exit 0
            echo "retry $i/3 after 20s..."; sleep 20
          done
          exit 1
  gitee:
    if: github.repository == 'badhope/moneyhelper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # GitHub runner 出口到 Gitee 会被间歇性 reset，属于网络问题而非代码问题；
      # 这里尽力重试，仍失败则跳过，避免偶发网络把整条 CI 判红。
      - name: push to gitee (best effort, network may reset)
        continue-on-error: true
        run: |
          git remote add mirror "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/badhope/moneyhelper.git"
          for i in 1 2 3 4 5; do
            git push mirror main --force && git push mirror --tags --force && exit 0
            echo "retry $i/5 after 30s..."; sleep 30
          done
          echo "::warning::gitee unreachable from runner, mirror not updated this run"

  github-x33834:
    if: github.repository == 'badhope/moneyhelper'
    runs-on: ubuntu-latest
    env:
      MIRROR_TOKEN: ${{ secrets.GH_X33834_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: push to GitHub mirror (X33834)
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then echo "skip: token not set"; exit 0; fi
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/X33834/moneyhelper.git"
          git push mirror main --force && git push mirror --tags --force

  github-morningstar:
    if: github.repository == 'badhope/moneyhelper'
    runs-on: ubuntu-latest
    env:
      MIRROR_TOKEN: ${{ secrets.GH_MORNINGSTAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: push to GitHub mirror (Morningstar202604)
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then echo "skip: token not set"; exit 0; fi
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/Morningstar202604/moneyhelper.git"
          git push mirror main --force && git push mirror --tags --force
